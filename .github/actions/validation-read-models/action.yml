name: AhaFrame validation read models
description: Shared Supabase-compatible read-model checks for GitHub-hosted and self-hosted runners.

runs:
  using: composite
  steps:
    - name: Ensure PostgreSQL client
      shell: bash
      run: |
        if command -v psql >/dev/null 2>&1; then
          psql --version
          exit 0
        fi
        sudo apt-get update
        sudo apt-get install -y postgresql-client
    - name: Prepare Supabase-compatible test roles and auth contract
      shell: bash
      env:
        PGPASSWORD: postgres
      run: |
        psql -h 127.0.0.1 -U postgres -d ahaframe_test -v ON_ERROR_STOP=1 <<'SQL'
        create role anon noinherit;
        create role authenticated noinherit;
        create role service_role noinherit;
        create schema if not exists auth;
        create table if not exists auth.users (
          id uuid primary key,
          created_at timestamptz not null default now()
        );
        create or replace function auth.uid()
        returns uuid
        language sql
        stable
        as $$
          select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid;
        $$;
        grant usage on schema auth to anon, authenticated, service_role;
        grant execute on function auth.uid() to anon, authenticated, service_role;
        SQL
    - name: Apply validation migrations
      shell: bash
      env:
        PGPASSWORD: postgres
      run: |
        for migration in supabase/migrations/*.sql; do
          echo "Applying $migration"
          psql -h 127.0.0.1 -U postgres -d ahaframe_test -v ON_ERROR_STOP=1 -f "$migration"
        done
    - name: Test Validation read models
      shell: bash
      env:
        PGPASSWORD: postgres
      run: psql -h 127.0.0.1 -U postgres -d ahaframe_test -v ON_ERROR_STOP=1 -f scripts/test_validation_read_models.sql
    - name: Test Content Entitlements
      shell: bash
      env:
        PGPASSWORD: postgres
      run: psql -h 127.0.0.1 -U postgres -d ahaframe_test -v ON_ERROR_STOP=1 -f scripts/test_content_entitlements.sql
