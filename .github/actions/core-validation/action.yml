name: AhaFrame core validation
description: Shared validation steps for the current Next.js production runtime.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - uses: actions/setup-node@v5
      with:
        node-version: '24'
        package-manager-cache: false

    - name: Verify legacy branding is gone
      shell: bash
      run: |
        if grep -R -n -E 'SeeAI|SEEAI_|window\.SeeAI|seeai_' src/assets content web; then
          echo 'Legacy SeeAI branding remains in current runtime sources.'
          exit 1
        fi

    - name: Test deterministic Lab Engine
      shell: bash
      run: node scripts/test_lab_engine.js

    - name: Test deterministic Mission Engine
      shell: bash
      run: node scripts/test_mission_engine.js

    - name: Test flagship Mission scenarios
      shell: bash
      run: |
        set -euo pipefail
        found=0
        for test_file in scripts/test_mission_*.js; do
          [ -e "$test_file" ] || continue
          [ "$test_file" = "scripts/test_mission_engine.js" ] && continue
          found=1
          echo "Running $test_file"
          node "$test_file"
        done
        if [ "$found" -eq 0 ]; then
          echo 'No flagship Mission scenario tests found.'
          exit 1
        fi

    - name: Test Integrated Build
      shell: bash
      run: node scripts/test_integrated_build.js

    - name: Test Validation Runtime
      shell: bash
      run: node scripts/test_validation_runtime.js

    - name: Test Validation backend boundary
      shell: bash
      run: python3 scripts/test_validation_backend.py

    - name: Test Lab reconciliation contract
      shell: bash
      run: python3 scripts/test_lab_reconciliation.py

    - name: Test Content System v0.9 graph contract
      shell: bash
      run: python3 scripts/test_learning_content_system.py

    - name: Test AI Knowledge Graph v1.0 schema contract
      shell: bash
      run: python3 scripts/test_ai_knowledge_graph_v1.py

    - name: Test Content & Experience preview contract
      shell: bash
      run: python3 scripts/test_content_preview_contract.py

    - name: Validate production smoke harness
      shell: bash
      run: python3 -m py_compile scripts/smoke_production.py

    - name: Test Validation operator report
      shell: bash
      run: python3 scripts/test_validation_report.py

    - name: Test Product Gate memo
      shell: bash
      run: python3 scripts/test_product_gate_memo.py

    - name: Install Next.js dependencies
      shell: bash
      working-directory: web
      run: npm install --no-audit --no-fund

    - name: Lint Next.js app
      shell: bash
      working-directory: web
      run: npm run lint

    - name: Typecheck Next.js app
      shell: bash
      working-directory: web
      run: npm run typecheck

    - name: Build Next.js app
      shell: bash
      working-directory: web
      run: npm run build

    - name: Check browser secret boundary
      shell: bash
      working-directory: web
      run: npm run check:browser-secrets

    - name: Smoke Next.js public routes at runtime
      shell: bash
      working-directory: web
      run: |
        set -euo pipefail
        if curl -fsS --max-time 1 http://127.0.0.1:3000/ >/dev/null 2>&1; then
          echo 'Port 3000 is unexpectedly occupied before Next runtime smoke.'
          exit 1
        fi
        log_file="${RUNNER_TEMP}/ahaframe-next-runtime.log"
        setsid ./node_modules/.bin/next start --hostname 127.0.0.1 --port 3000 >"$log_file" 2>&1 &
        server_pid=$!
        cleanup() {
          kill -TERM -- "-$server_pid" >/dev/null 2>&1 || true
          wait "$server_pid" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT

        python3 - <<'PY'
        import json
        import time
        import urllib.error
        import urllib.request
        from pathlib import Path

        base = "http://127.0.0.1:3000"

        def fetch(path: str, retries: int = 1) -> str:
            url = f"{base}{path}"
            last_error = None
            for _ in range(retries):
                try:
                    with urllib.request.urlopen(url, timeout=10) as response:
                        if response.status != 200:
                            raise RuntimeError(f"{path} returned HTTP {response.status}")
                        return response.read().decode("utf-8")
                except (urllib.error.URLError, ConnectionError, TimeoutError) as exc:
                    last_error = exc
                    time.sleep(0.5)
            raise RuntimeError(f"{path} did not become ready: {last_error}")

        root_html = fetch("/", retries=40)
        if "<html" not in root_html.lower() or "AhaFrame" not in root_html:
            raise RuntimeError("root route did not return the expected AhaFrame HTML shell")

        marker = json.loads(fetch("/assets/build-meta.json"))
        if marker.get("gitCommitSha") == "unknown":
            raise RuntimeError("Next release marker must contain an exact commit SHA")

        repo_root = Path.cwd().parent
        checked = 1
        for locale, segment in (("en", "en"), ("zh-CN", "zh-cn")):
            source = json.loads((repo_root / "content" / f"{locale}.json").read_text(encoding="utf-8"))
            for route in source["availableRoutes"]:
                path = f"/{segment}/{route}" if route else f"/{segment}/"
                html = fetch(path)
                if "<html" not in html.lower() or "AhaFrame" not in html:
                    raise RuntimeError(f"{path} did not return the expected AhaFrame HTML shell")
                checked += 1

        print(f"PASS Next runtime smoke: {checked} HTTP routes served successfully (root + 13 routes × 2 locales).")
        PY

        cleanup
        trap - EXIT
        if curl -fsS --max-time 1 http://127.0.0.1:3000/ >/dev/null 2>&1; then
          echo 'Next runtime smoke server did not release port 3000.'
          exit 1
        fi

    - name: Install Playwright Chromium
      shell: bash
      working-directory: web
      run: npx playwright install --with-deps chromium

    - name: Test current Lab and Mission interactions
      shell: bash
      working-directory: web
      run: npm run test:interaction
