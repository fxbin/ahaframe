name: Reusable Localization Release QA

on:
  workflow_call:
    inputs:
      runner:
        description: JSON runner selector, e.g. "ubuntu-latest" or ["self-hosted","linux","x64"]
        required: true
        type: string

permissions:
  contents: read

jobs:
  localization-release-qa:
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt
      - name: Test bilingual validation runtime
        run: node scripts/test_validation_runtime.js
      - name: Build bilingual static site
        env:
          AHAFRAME_BASE_URL: https://ahaframe.com
        run: python3 scripts/build_site.py
      - name: Run localization release QA
        run: python3 scripts/test_release_localization_qa.py
      - name: Compile production smoke harness
        run: python3 -m py_compile scripts/smoke_production.py
