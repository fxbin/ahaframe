name: M5 Cutover Rehearsal

on:
  push:
    branches: [platform/m5-cutover-rehearsal]
  pull_request:
    branches: [platform/m4-parity-proof]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/core-validation

      - name: Check browser secret boundary
        working-directory: web
        run: npm run check:browser-secrets

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Re-run M3 interaction gate
        working-directory: web
        run: npm run test:interaction

      - name: Re-run M4 legacy-to-Next parity
        working-directory: web
        run: npm run test:parity

      - name: Rehearse fail-closed production runtime
        working-directory: web
        env:
          CUTOVER_EXPECTED_COMMIT: ${{ github.sha }}
          CUTOVER_EXPECTED_ENVIRONMENT: ci
          CUTOVER_EXPECT_INDEXING: '0'
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/ahaframe-cutover-default.log"
          npm run start -- --hostname 127.0.0.1 --port 4300 >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4300/assets/build-meta.json >/dev/null; then break; fi
            sleep 0.5
          done
          node scripts/check-cutover-runtime.mjs

      - name: Build exact production-equivalent candidate with indexing enabled
        working-directory: web
        env:
          AHAFRAME_BUILD_COMMIT_SHA: ${{ github.sha }}
          AHAFRAME_BUILD_COMMIT_REF: ${{ github.ref_name }}
          AHAFRAME_BUILD_ENV: production
          AHAFRAME_INDEXING_ENABLED: '1'
        run: |
          set -euo pipefail
          rm -rf .next
          npm run build

      - name: Re-check browser secret boundary after production-equivalent build
        working-directory: web
        run: npm run check:browser-secrets

      - name: Rehearse index-enabled production runtime
        working-directory: web
        env:
          CUTOVER_EXPECTED_COMMIT: ${{ github.sha }}
          CUTOVER_EXPECTED_ENVIRONMENT: production
          CUTOVER_EXPECT_INDEXING: '1'
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/ahaframe-cutover-enabled.log"
          npm run start -- --hostname 127.0.0.1 --port 4300 >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4300/assets/build-meta.json >/dev/null; then break; fi
            sleep 0.5
          done
          node scripts/check-cutover-runtime.mjs

      - name: Summarize M5 rehearsal evidence
        if: success()
        run: |
          {
            echo '## M5 cutover rehearsal'
            echo '- M2/M3/M4 regression gates: PASS'
            echo '- default fail-closed indexing mode: PASS'
            echo '- exact Next release marker: PASS'
            echo '- canonical trailing-slash redirects: PASS'
            echo '- inherited production security headers: PASS'
            echo '- clean production-equivalent indexing-enabled rebuild: PASS'
            echo '- browser-secret boundary before/after index flip: PASS'
            echo '- rollback runbook: docs/NEXT_RUNTIME_CUTOVER.md'
          } >> "$GITHUB_STEP_SUMMARY"

  validation-read-models:
    name: validation-read-models
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ahaframe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ahaframe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/validation-read-models
