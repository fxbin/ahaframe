name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production base URL
        required: true
        default: https://ahaframe.com
      validation_endpoint:
        description: Supabase validation-ingest endpoint
        required: true
        default: https://swzddvprnyjrrgpzcsgp.supabase.co/functions/v1/validation-ingest

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run production smoke
        run: >-
          python3 scripts/smoke_production.py
          --base-url "${{ inputs.base_url }}"
          --validation-endpoint "${{ inputs.validation_endpoint }}"
          --run-id "github-${{ github.run_id }}"
