name: Next Cutover Rehearsal

on:
  push:
    branches: [platform/m5-cutover-rehearsal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Guard manual rehearsal ref
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo 'Manual production cutover rehearsal must run from main.'
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: ./.github/actions/core-validation

      - name: Check browser secret boundary
        working-directory: web
        run: npm run check:browser-secrets

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Re-run M3 interaction gate
        working-directory: web
        run: npm run test:interaction

      - name: Re-run M4 legacy-to-Next parity
        working-directory: web
        run: npm run test:parity

      - name: Rehearse fail-closed production runtime
        working-directory: web
        env:
          CUTOVER_EXPECTED_COMMIT: ${{ github.sha }}
          CUTOVER_EXPECTED_ENVIRONMENT: ci
          CUTOVER_EXPECT_INDEXING: '0'
        run: |
          set -euo pipefail
          if curl -fsS --max-time 1 http://127.0.0.1:4300/assets/build-meta.json >/dev/null 2>&1; then
            echo 'Port 4300 is unexpectedly occupied before fail-closed rehearsal.'
            exit 1
          fi
          log_file="${RUNNER_TEMP}/ahaframe-cutover-default.log"
          setsid ./node_modules/.bin/next start --hostname 127.0.0.1 --port 4300 >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill -TERM -- "-$server_pid" >/dev/null 2>&1 || true
            wait "$server_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4300/assets/build-meta.json >/dev/null; then break; fi
            sleep 0.5
          done
          node scripts/check-cutover-runtime.mjs
          cleanup
          trap - EXIT
          if curl -fsS --max-time 1 http://127.0.0.1:4300/assets/build-meta.json >/dev/null 2>&1; then
            echo 'Fail-closed Next server did not release port 4300.'
            exit 1
          fi

      - name: Build exact production-equivalent candidate with indexing enabled
        working-directory: web
        env:
          AHAFRAME_BUILD_COMMIT_SHA: ${{ github.sha }}
          AHAFRAME_BUILD_COMMIT_REF: ${{ github.ref_name }}
          AHAFRAME_BUILD_ENV: production
          AHAFRAME_INDEXING_ENABLED: '1'
        run: |
          set -euo pipefail
          rm -rf .next
          npm run build

      - name: Re-check browser secret boundary after production-equivalent build
        working-directory: web
        run: npm run check:browser-secrets

      - name: Rehearse index-enabled production runtime
        working-directory: web
        env:
          CUTOVER_EXPECTED_COMMIT: ${{ github.sha }}
          CUTOVER_EXPECTED_ENVIRONMENT: production
          CUTOVER_EXPECT_INDEXING: '1'
        run: |
          set -euo pipefail
          if curl -fsS --max-time 1 http://127.0.0.1:4300/assets/build-meta.json >/dev/null 2>&1; then
            echo 'Port 4300 is unexpectedly occupied before index-enabled rehearsal.'
            exit 1
          fi
          log_file="${RUNNER_TEMP}/ahaframe-cutover-enabled.log"
          setsid ./node_modules/.bin/next start --hostname 127.0.0.1 --port 4300 >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill -TERM -- "-$server_pid" >/dev/null 2>&1 || true
            wait "$server_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4300/assets/build-meta.json >/dev/null; then break; fi
            sleep 0.5
          done
          node scripts/check-cutover-runtime.mjs
          cleanup
          trap - EXIT
          if curl -fsS --max-time 1 http://127.0.0.1:4300/assets/build-meta.json >/dev/null 2>&1; then
            echo 'Index-enabled Next server did not release port 4300.'
            exit 1
          fi

      - name: Summarize rehearsal evidence
        if: success()
        run: |
          {
            echo '## Next cutover rehearsal'
            echo '- core/runtime regression gates: PASS'
            echo '- browser secret boundary: PASS'
            echo '- M3 Chromium interaction gate: PASS'
            echo '- M4 legacy-to-Next parity gate: PASS'
            echo '- default fail-closed indexing mode: PASS'
            echo '- exact release marker + indexing mode identity: PASS'
            echo '- trailing-slash + security-header contracts: PASS'
            echo '- clean production-equivalent indexing-enabled rebuild: PASS'
            echo '- blocked/enabled server lifecycle isolation: PASS'
            echo '- rollback runbook: docs/NEXT_RUNTIME_CUTOVER.md'
          } >> "$GITHUB_STEP_SUMMARY"

  validation-read-models:
    name: validation-read-models
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ahaframe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ahaframe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Guard manual rehearsal ref
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo 'Manual production cutover rehearsal must run from main.'
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: ./.github/actions/validation-read-models
