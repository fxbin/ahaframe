name: Prune stale branches

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    name: prune-stale-branches
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches whose work is already closed
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const explicitlyRetired = new Set([
              'feature/reliable-support-agent-build',
              'feature/46-zh-harness-graph-evaluation',
            ]);

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });

            for (const { name } of branches) {
              if (name === 'main') continue;

              if (explicitlyRetired.has(name)) {
                core.info(`DELETE ${name}: explicitly retired after post-cutover review`);
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${name}`,
                });
                continue;
              }

              const pulls = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'all',
                head: `${owner}:${name}`,
                per_page: 100,
              });

              const openPull = pulls.find((pull) => pull.state === 'open');
              if (openPull) {
                core.info(`KEEP ${name}: open PR #${openPull.number}`);
                continue;
              }

              if (pulls.length > 0) {
                const refs = pulls.map((pull) => `#${pull.number}:${pull.merged_at ? 'merged' : 'closed'}`).join(', ');
                core.info(`DELETE ${name}: no open PR; historical PRs=${refs}`);
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${name}`,
                });
                continue;
              }

              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `main...${name}`,
              });
              const { ahead_by: aheadBy, behind_by: behindBy } = comparison.data;

              if (aheadBy === 0) {
                core.info(`DELETE ${name}: fully contained in main`);
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${name}`,
                });
                continue;
              }

              core.info(`KEEP ${name}: no PR history and unique commits remain (ahead=${aheadBy}, behind=${behindBy})`);
            }
