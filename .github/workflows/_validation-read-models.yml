name: Reusable Validation Read Models

on:
  workflow_call:
    inputs:
      runner:
        description: JSON runner selector, e.g. "ubuntu-latest" or ["self-hosted","linux","x64"]
        required: true
        type: string

permissions:
  contents: read

jobs:
  validation-read-models:
    runs-on: ${{ fromJSON(inputs.runner) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ahaframe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ahaframe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare Supabase-compatible test roles
        run: |
          psql -h 127.0.0.1 -U postgres -d ahaframe_test -v ON_ERROR_STOP=1 <<'SQL'
          create role anon noinherit;
          create role authenticated noinherit;
          create role service_role noinherit;
          SQL
      - name: Apply validation migrations
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -h 127.0.0.1 -U postgres -d ahaframe_test -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Test Validation read models
        run: |
          psql -h 127.0.0.1 -U postgres -d ahaframe_test -v ON_ERROR_STOP=1 -f scripts/test_validation_read_models.sql
