name: Self Hosted Probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: self-hosted-probe
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Print runner diagnostics
        run: |
          set -eu
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          echo "repository=${GITHUB_REPOSITORY}"
          echo "sha=${GITHUB_SHA}"
          uname -a || true
          command -v python3 || true
          command -v node || true
          echo "self-hosted probe passed"
