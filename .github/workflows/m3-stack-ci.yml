name: M3 Stack CI

on:
  push:
    branches: [platform/m3-interaction-engine]
  pull_request:
    branches: [platform/m2-route-parity]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/core-validation
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Test Next interaction adapters in Chromium
        working-directory: web
        run: npm run test:interaction

  validation-read-models:
    name: validation-read-models
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ahaframe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ahaframe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/validation-read-models
