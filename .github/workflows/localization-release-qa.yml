name: Localization Release QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: localization-release-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select-runner:
    name: select-runner
    runs-on: [self-hosted, linux, x64]
    outputs:
      runner: ${{ steps.select.outputs.runner }}
      mode: ${{ steps.select.outputs.mode }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - name: Select CI runner
        id: select
        env:
          GH_BILLING_READ_TOKEN: ${{ secrets.GH_BILLING_READ_TOKEN }}
          ACTIONS_CLOUD_RESERVE_MINUTES: '60'
        run: python3 .github/scripts/select-ci-runner.py
      - name: Report selection
        run: |
          echo "Runner mode: ${{ steps.select.outputs.mode }}"
          echo "Reason: ${{ steps.select.outputs.reason }}"

  zh-cn-release-gate:
    name: zh-cn-release-gate
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/localization-release-qa
